name: BugFlow CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
      - 'release/**'
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Target deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
          - none

permissions:
  contents: read
  packages: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Code Validation & Linting ───────────────────────────────────────────
  lint-and-validate:
    name: 🔍 Validate & Lint Code
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Install Python Linters & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff -r backend/requirements.txt

      - name: 🧪 Check Python Syntax Compilation
        run: |
          python -m py_compile backend/app/*.py backend/app/routers/*.py backend/tests/*.py

      - name: 🔎 Run Ruff Linter
        run: |
          ruff check backend/app backend/tests --exit-zero

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: 📦 Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: 🔍 Validate Frontend Package Audit
        working-directory: ./frontend
        run: npm audit --audit-level=high || true

  # ── 2. Backend Automated Test Suite ────────────────────────────────────────
  test-backend:
    name: 🧪 Run Automated Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint-and-validate
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']

    env:
      DATABASE_URL: "sqlite:///:memory:"
      SECRET_KEY: "ci-test-secret-key-for-github-actions"
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
      ALGORITHM: "HS256"

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: 📦 Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: 🚀 Execute PyTest Automated Workflows
        working-directory: ./backend
        run: |
          pytest -v tests/ --durations=10

  # ── 3. Frontend Production Build ───────────────────────────────────────────
  build-frontend:
    name: 🏗️ Build Frontend Application
    runs-on: ubuntu-latest
    needs: lint-and-validate

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: 📦 Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: 🔨 Compile Production Build Bundle
        working-directory: ./frontend
        run: npm run build

      - name: 📤 Upload Frontend Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bugflow-frontend-dist
          path: frontend/dist
          retention-days: 14

  # ── 4. Container Build Verification ────────────────────────────────────────
  build-containers:
    name: 🐳 Verify Docker Container Builds
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend]

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔨 Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: bugflow-backend:ci-test

      - name: 🔨 Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: bugflow-frontend:ci-test

  # ── 5. Optional Continuous Deployment ──────────────────────────────────────
  deploy:
    name: 🚀 Deploy Application (${{ github.event.inputs.deploy_target || (github.ref == 'refs/heads/main' && 'production' || 'staging') }})
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend, build-containers]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📥 Download Frontend Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: bugflow-frontend-dist
          path: frontend/dist

      - name: 🌐 Deploy Frontend (GitHub Pages / Static Host)
        run: |
          echo "====================================================="
          echo "🚀 Deploying BugFlow Frontend to Target Environment"
          echo "Build Output: frontend/dist contains $(ls -la frontend/dist | wc -l) files"
          echo "====================================================="

      - name: 🐳 Deploy Backend Services (Container Registry / Cloud Run)
        env:
          DEPLOY_ENV: ${{ github.event.inputs.deploy_target || 'production' }}
        run: |
          echo "====================================================="
          echo "🚀 Deploying BugFlow Backend API Services"
          echo "Environment: $DEPLOY_ENV"
          echo "Target Commit: ${{ github.sha }}"
          echo "Status: Build verified & ready for rollout"
          echo "====================================================="
