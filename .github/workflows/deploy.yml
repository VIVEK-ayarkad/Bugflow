name: BugFlow Continuous Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - staging
          - production
      deploy_backend:
        description: 'Deploy Backend API Container'
        required: true
        default: true
        type: boolean
      deploy_frontend:
        description: 'Deploy Frontend Web Client'
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  deploy-backend:
    name: 🐍 Deploy Backend API
    if: ${{ github.event.inputs.deploy_backend == 'true' || github.event.inputs.deploy_backend == true }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔨 Build and Push Backend Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.repository_owner != '' }}
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}

      - name: 🚀 Trigger Backend Rollout (Webhook / Cloud Engine)
        run: |
          echo "Backend container published and deployment triggered for environment: ${{ github.event.inputs.environment }}"

  deploy-frontend:
    name: 🌐 Deploy Frontend Application
    if: ${{ github.event.inputs.deploy_frontend == 'true' || github.event.inputs.deploy_frontend == true }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: 📦 Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: 🔨 Build Production Distribution
        working-directory: ./frontend
        run: npm run build

      - name: 🚀 Deploy Static Web Assets
        run: |
          echo "Frontend distribution built successfully and ready for deployment to: ${{ github.event.inputs.environment }}"
